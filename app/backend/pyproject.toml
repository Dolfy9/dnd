[project]
name = "montelien"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "Markdown>=3.6",
  "argon2-cffi>=23.1",
  "itsdangerous>=2.2",
  "watchdog>=4.0",
  "Pillow>=10.0",
  "python-multipart>=0.0.9",
]
[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.5"]
[tool.ruff]
line-length = 120
